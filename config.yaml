# =============================================================================
# DeepFake Detection System - Configuration
# Maps to FR/NFR identifiers from the SRS (see README traceability table).
# =============================================================================

server:
  host: 127.0.0.1
  port: 5000
  debug: false                    # NFR-07: fully-local inference; no external calls

uploads:
  upload_dir: uploads             # Tier-3 temporary storage
  session_expiry_seconds: 360000    # FR-20: temp files auto-deleted after 1 hour
  max_image_size_mb: 10           # FR-04
  max_video_size_mb: 100          # FR-04
  allowed_image_types: [image/jpeg, image/png]       # FR-01
  allowed_video_types: [video/mp4, video/x-msvideo]  # FR-02
  max_video_duration_seconds: 60  # FR-02: first 60 s analysed in v1.0

models:
  device: auto                    # auto | cpu | cuda

  # ===========================================================================
  # NEW DeepShield-trained models (replace all old models)
  # Place the .pth files in the models/ folder before starting the server.
  # ===========================================================================

  new_xception:                   # timm legacy_xception, 2-class (Real/Fake)
    name: "XceptionNet (DeepShield)"
    type: legacy_xception
    checkpoint: ./models/best_xception.pth

  new_efficientnet:               # torchvision EfficientNet-B3, 2-class
    name: "EfficientNet-B3 (DeepShield)"
    type: efficientnet_b3
    checkpoint: ./models/best_efficientnet_b3.pth

  new_vit_small:                  # timm vit_small_patch16_224, 2-class
    name: "ViT-Small (DeepShield)"
    type: vit_small_patch16_224
    checkpoint: ./models/best_vit_small.pth

  new_vit_large_clip:             # timm vit_large_patch14_clip_224, 2-class
    name: "ViT-Large/CLIP (DeepShield)"
    type: vit_large_patch14_clip_224
    checkpoint: ./models/best_vit_large_clip.pth

ensemble:                         # FR-14: equal-weight soft voting across 4 new models
  # All 4 DeepShield-trained models vote with equal weight (1.0 each).
  # The ensemble.combine() normalises by sum-of-weights automatically.
  # Set a model's weight to 0.0 to exclude it without removing the file.
  image_weights:                  # UC-03 image detection (ViT-Large CLIP lead + Dual CNN anchors)
    new_vit_large_clip: 2.0       # Primary AI/synthesis detector (dominates prompt & diffusion fakes)
    new_efficientnet: 0.8         # 92.47% StyleGAN3 + GRAVEX fine-tuned CNN anchor
    new_xception: 0.8             # 91.47% StyleGAN3 + DeepShield fine-tuned CNN anchor
    new_vit_small: 0.4            # Feature stability vote
  video_weights:                  # UC-04 video detection (4-Model Temporal & Boundary Ensemble)
    new_xception: 1.2             # 91.47% fine-tuned frame-by-frame texture boundary classifier
    new_efficientnet: 1.2         # 92.47% fine-tuned facial consistency anchor
    new_vit_large_clip: 1.0       # AI generative synthesis & semantic motion feature detector
    new_vit_small: 0.6            # Spatial feature stability vote
  image_threshold: 0.35            # Calibrated threshold (captures prompt-generated fakes)
  video_threshold: 0.45            # video detection threshold (sensitive with Top-K frame pooling)
  threshold: 0.35                  # default fallback threshold
 
preprocessing:
  video_fps: 5                    # FR-05: configurable frame extraction rate
  max_frames: 40                  # uniform sample of frames for analysis
  target_size: 224                # FR-09: model input resolution
  face_margin: 0.10               # crop pad around MTCNN box (0.10 matches face crops)
  mtcnn_confidence: 0.95          # MTCNN conf threshold (Section 5.4.1)
  normalize_mode: scale_01        # scale_01 (0..1 range matching training) | imagenet
  imagenet_mean: [0.485, 0.456, 0.406]             # FR-10
  imagenet_std: [0.229, 0.224, 0.225]              # FR-10

metrics:
  output_dir: metrics